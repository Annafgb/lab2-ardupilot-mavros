# Параметри вузла mission_ap (локальна система ENU MAVROS: x - схід, y - північ, метри від точки зльоту)
h: 10.0        # висота польоту, м
tol: 0.5       # радіус прибуття, м
hold: 1.0      # утримання в радіусі, с
rate: 20.0     # частота публікації цілі, Гц
A: [0.0, 0.0]  # над точкою зльоту
B: [20.0, 0.0]
C: [20.0, 20.0]
D: [0.0, 20.0]
